<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="theme-color" content="#06040b">
    <title>AURA</title>
    <link rel="stylesheet" href="./css/style.css">
</head>

<body>
    <main id="loadingScreen" aria-live="polite">
        <div id="viewport" aria-hidden="true"></div>

        <header class="brand">
            <span class="brand-name">AURA</span>
            <span class="brand-subtitle">Silhouette Experience</span>
        </header>

        <section class="loading-copy">
            <p class="eyebrow">Private by design</p>
            <h1>Preparing your experience</h1>
            <p id="loadingStatus">Loading visual scene</p>

            <div class="progress-track" aria-hidden="true">
                <span class="progress-glow"></span>
            </div>
        </section>
    </main>

    <script type="module" src="./js/scripts.js"></script>
</body>

</html>
